# Deploys the AuriGPT frontend (web/) to GitHub Pages in MOCK mode.
# (Pages is static — no serverless proxy — so the live backend uses Vercel instead.)
# Enable: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy AuriGPT (web) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Auto-enable Pages on first run so the deploy job doesn't 404 with
      # "Ensure GitHub Pages has been enabled". (Needs pages: write — set above.)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
