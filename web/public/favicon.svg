<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="32%" stop-color="#ffb347"/>
      <stop offset="72%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark disc so the icon reads on any tab colour -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#1fe5ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- outer cyan HUD ring with gaps -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#1fe5ff" stroke-width="2.6"
          stroke-dasharray="30 13" stroke-linecap="round"/>

  <!-- inner dashed tick ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#35c8e8" stroke-width="1.2"
          stroke-dasharray="1.4 3" opacity="0.75"/>

  <!-- crosshair ticks -->
  <g stroke="#1fe5ff" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <line x1="32" y1="2.5" x2="32" y2="9"/>
    <line x1="32" y1="55" x2="32" y2="61.5"/>
    <line x1="2.5" y1="32" x2="9" y2="32"/>
    <line x1="55" y1="32" x2="61.5" y2="32"/>
  </g>

  <!-- glowing gold reactor core -->
  <circle cx="32" cy="32" r="13.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="4.2" fill="#fff6e0"/>
</svg>
